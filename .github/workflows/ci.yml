name: CI - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '../.nvmrc'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check syntax & module imports
        run: node -e "import('./src/server.js').then(() => console.log('Server module loaded successfully')).catch(err => { console.error(err); process.exit(1); })"
        env:
          DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres"
          JWT_SECRET: "ci_pipeline_test_jwt_secret_key_12345"
          NODE_ENV: "test"

  frontend-checks:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client/user-portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '../../.nvmrc'
          cache: 'npm'
          cache-dependency-path: './client/user-portal/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build
