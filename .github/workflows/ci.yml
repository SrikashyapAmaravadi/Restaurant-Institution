name: Continuous Integration & Security Auditing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
      DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
      JWT_SECRET: 'ci-jwt-secret-minimum-32-characters'
      OTP_PEPPER: 'ci-otp-pepper-minimum-32-characters'
      CRON_SECRET: 'ci-cron-secret-minimum-32-characters'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply Test Database Schema
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Run Linter (Oxlint)
        run: npx oxlint

      - name: Run Backend Integration & Security Tests
        run: npm --prefix server test

      - name: Verify Frontend Production Build
        run: npm run build
